vendor_name: "The Bike Shop"
city: "Brisbane"
max_pages: 15
base_url: "https://www.thebikeshop.au"
pipeline: "shopify"
# Hierarchical dash-separated product_type: "Bikes - E-Bikes - E-Mountain Bike", "Bikes - MTB - Hardtail", etc.
