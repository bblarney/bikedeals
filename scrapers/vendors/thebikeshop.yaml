# e-bikes before mtb so "Bikes - E-Bikes - E-Mountain Bike" maps to E-Bike, not Mountain.
category_map:
  e-bikes: E-Bike
  mtb: Mountain
  dirt jumper: Mountain
  road: Road
  kids: Commuter
