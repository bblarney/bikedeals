vendor_name: "NRG Cycles"
city: "Brisbane"
shop_path: "product-category/bikes"
max_pages: 5
base_url: "https://www.nrgcycles.com.au"
pipeline: "woocommerce"
# Brand extracted from product_cat-<slug> CSS classes on each article element.
# norco-bikes-2: WordPress appends -2 to disambiguate from a conflicting slug.
brand_map:
  avanti: Avanti
  gt: GT
  norco-bikes-2: Norco
  pivot: Pivot
  rocky-mountain: Rocky Mountain
  scott: Scott
category_map:
  ebike: E-Bike
  e-bike: E-Bike
  electric: E-Bike
  mountain: Mountain
  mtb: Mountain
  gravel: Gravel
  road: Road
  commuter: Commuter
  hybrid: Commuter
  city: Commuter
selectors:
  product_list: "article.product"
  model_name: "h4.entry-title a"
  price_sale: "span.price ins bdi"
  price_regular: "span.price bdi"
  price_original: "span.price del bdi"
  product_url: "h4.entry-title a"
  image_url: "img[data-src]"
