vendor_name: "Pedal Heads"
city: "Brisbane"
collection: "bikes"
max_pages: 10
base_url: "https://www.pedalheads.com.au"
pipeline: "shopify"
# Hierarchical product_type: "Bikes | E-bike | Mtb | Full Suspension | 29", etc.
# "Indoor Training | Stationary Bikes" has no matching key and is silently skipped.
# e-bike before mtb/road so e-MTBs and e-road bikes map to E-Bike.
# gravel before road so "Road | Gravel/All Road" maps to Gravel, not Road.
category_map:
  e-bike: E-Bike
  mtb: Mountain
  gravel: Gravel
  road: Road
  juvenile: Commuter
  city: Commuter
  hybrid: Commuter
