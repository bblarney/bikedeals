vendor_name: "99 Bikes"
# Scope to bikes collection to avoid crawling their full historical catalogue.
# Find the handle by visiting https://www.99bikes.com.au/collections/ and checking
# the URL of their bikes section. Common handles: bikes, bicycles, bikes-scooters.
collection: "bikes"
max_pages: 40
cities:
  - Brisbane
  - Melbourne
  - Sydney
  - Adelaide
  - Canberra
  - Hobart
  - Gold Coast
  - Sunshine Coast
  # Perth not confirmed in current store locator — re-add if they open there
base_url: "https://www.99bikes.com.au"
pipeline: "shopify"
# Keys are matched as substrings of product_type (case-insensitive).
# 99 Bikes uses a hierarchical format: "Bikes & Scooters : Bikes : Mountain Bikes"
category_map:
  mountain bikes: Mountain
  mountain bike: Mountain
  trail bikes: Mountain
  trail bike: Mountain
  enduro: Mountain
  fat bike: Mountain
  fat-bike: Mountain
  road bikes: Road
  road bike: Road
  road & gravel: Road
  touring: Road
  gravel bikes: Gravel
  gravel bike: Gravel
  electric bikes: E-Bike
  electric bike: E-Bike
  e-bikes: E-Bike
  e-bike: E-Bike
  ebike: E-Bike
  kids bikes: Commuter
  kids bike: Commuter
  hybrid bikes: Commuter
  hybrid bike: Commuter
  commuter bikes: Commuter
  commuter bike: Commuter
  city bikes: Commuter
  city bike: Commuter
  urban bikes: Commuter
  urban bike: Commuter
  cargo bikes: Commuter
  cargo bike: Commuter
  folding bikes: Commuter
  folding bike: Commuter
  bmx: Commuter
