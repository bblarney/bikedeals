# Joondalup-area Specialized dealer. Previously filed as blocked, JS-rendered
# ("Austin Theme").
#
# `bikes/frames` is excluded for the same reason as BAM: framesets are dropped
# by the accessory filter, so walking six brand-keyed frame categories a night
# buys nothing.
