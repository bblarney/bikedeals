  - bikes/electric-bikes
  - bikes/mountain-bikes
  - bikes/gravel-bikes
  - bikes/road-bikes
  - bikes/active-bikes
  - bikes/kids-bikes
category_map:
  electric-bikes: E-Bike
  mountain-bikes: Mountain
  gravel-bikes: Gravel
  road-bikes: Road
  active-bikes: Commuter
  kids-bikes: Commuter
