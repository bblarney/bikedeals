vendor_name: "Cranks"
city: "Sydney"
base_url: "https://cranks.com.au"
pipeline: "ecwid_next"
# Replatformed (2026-08) from WooCommerce to a headless Next.js storefront over
# an Ecwid catalogue: /shop/bikes still returns 200, but with no product markup
# at all, so the old DOM selectors scraped 0 bikes every night.
# shop_path is the listing page whose build chunk carries the catalogue.
shop_path: "bikes"
# Top-level Ecwid categories to keep. The catalogue is the shop's whole
# inventory — "Helmets", workshop services, spare parts — and only "Bikes"
# holds complete bikes.
collections:
  - "Bikes"
# Labels the catalogue never sets a `brand` for; matched in the product name so
# these don't fall back to the shop's own name.
brand_map:
  base bike: "Base Bikes"
  hornit: "Hornit"
  kule: "Kule"
# Matched against the Ecwid category path, e.g.
# "Bikes / Mountain Bikes / Hard Tail", "Bikes / E Bikes / E MTB Bikes".
# E-bike keys before the discipline keys: the pipeline offers electric paths
# first so an e-MTB doesn't resolve to Mountain.
category_map:
  e bikes: E-Bike
  e-bikes: E-Bike
  electric: E-Bike
  mountain bikes: Mountain
  dual suspension: Mountain
  hard tail: Mountain
  dirt jumper: Mountain
  fat bikes: Mountain
  cx and gravel: Gravel
  gravel: Gravel
  road bikes: Road
  commuter & urban: Commuter
  city & hybrid: Commuter
  flat bar: Commuter
  cruisers: Commuter
  folding: Commuter
  kids bikes: Commuter
  balance bikes: Commuter
  bmx: Commuter
