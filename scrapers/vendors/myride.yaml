vendor_name: "My Ride"
# No city — My Ride is a national network of 20+ independently owned stores on one Shopify domain.
# product_type = store name (e.g., "Sheppard" = Shepparton) — not useful for category.
# Category resolved from hierarchical tags: "categoryTree:Bikes - Mtb - Hardtail", etc.
# Stores: Melbourne (Collingwood, Brunswick), Geelong, Shepparton, Ballarat, Wollongong,
#         Hobart, Launceston, Cairns, Mackay, Rockhampton, Perth (Osborne Park, Cannington),
#         Adelaide (Semaphore, Salisbury), Canberra, Alice Springs
