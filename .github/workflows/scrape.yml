name: Daily Scrape

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Joins the tailnet so this runner can reach Postgres on the VPS. The
      # database has no public listener at all - the 100.x tailnet address is
      # the only route to it, so this step must succeed for the run to work.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Route vendor requests through the Cloudflare Worker proxy so they
          # egress from a Cloudflare IP instead of GitHub's blocked datacenter
          # range. See worker/README.md. If these are unset the scraper fetches
          # vendors directly (and gets blocked), so both must be configured.
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
          SCRAPER_PROXY_TOKEN: ${{ secrets.SCRAPER_PROXY_TOKEN }}
        run: python -m scrapers.run

      - name: Rebuild the frontend
        # The prerender bakes tonight's shop stats and deal cards into the
        # static HTML (frontend/scripts/prerender.js), so the site is rebuilt
        # after every scrape rather than only on push. The hook URL is a Pages
        # deploy hook (Settings, Builds & deployments); without the secret this
        # step is a no-op and the baked numbers wait for the next push. Not
        # `if: always()`: a failed scrape should not republish stale data as
        # tonight's.
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not set; skipping the frontend rebuild"
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$CF_PAGES_DEPLOY_HOOK")"
          echo "deploy hook returned $code"
          test "$code" = "200"

      - name: Format email
        if: always()
        id: format
        run: |
          python - <<'PYEOF'
          import json, os, pathlib

          def clean(value):
              # Collapse any newlines/control chars: they would break the
              # single-line GITHUB_OUTPUT format and the email subject.
              return " ".join(str(value).split())

          p = pathlib.Path("scrape_summary.json")
          try:
              if not p.exists():
                  raise FileNotFoundError("scrape_summary.json was not written")
              s = json.loads(p.read_text())
              status = "OK" if s["vendors_failed"] == 0 else f"FAILED ({s['vendors_failed']} vendor(s))"
              subject = f"Bikedeals scrape — {status} — {clean(s['run_at'])[:10]}"
              lines = [
                  f"Run:            {s['run_at']}",
                  f"Duration:       {s['duration_seconds']}s",
                  "",
                  f"Vendors OK:     {s['vendors_ok']} / {s['vendors_total']}",
                  f"Vendors failed: {s['vendors_failed']}",
                  f"Bikes upserted: {s['total_bikes_upserted']}",
              ]
              # Listings we refused to publish, by kind. Both are shown every
              # run: a mis-tuned rule announces itself as a number that suddenly
              # jumps, and the default sort is discount_desc, so a shop's price
              # typo is the first thing a visitor sees.
              #
              # One loop rather than two near-identical blocks — they differ
              # only in the summary key and the label.
              for label, prefix in (
                  ("Non-bikes dropped", "non_bikes"),
                  ("Implausible RRPs dropped", "implausible_rrp"),
              ):
                  count = s.get(f"{prefix}_dropped", 0)
                  if not count:
                      continue
                  lines += ["", f"{label}: {count}"]
                  for reason, n in s.get(f"{prefix}_by_reason", {}).items():
                      lines.append(f"  - {clean(reason)}: {n}")
                  by_vendor = s.get(f"{prefix}_by_vendor", {})
                  if by_vendor:
                      lines.append("  top vendors: " + ", ".join(
                          f"{clean(v)} ({n})" for v, n in by_vendor.items()
                      ))

              if s["failures"]:
                  lines += ["", "Failures:"]
                  for f in s["failures"]:
                      lines.append(f"  - {clean(f['vendor'])}: {clean(f['error'])}")

              # Every warning/error logged during the run, not just the failures
              # above — so issues that don't sink a whole vendor stay visible.
              warnings = s.get("warnings", [])
              if warnings:
                  lines += ["", f"Warnings & errors ({len(warnings)}):"]
                  for w in warnings:
                      count = w.get("count", 1)
                      suffix = f" (x{count})" if count > 1 else ""
                      lines.append(f"  - [{clean(w['level'])}] {clean(w['message'])}{suffix}")
              body = "\n".join(lines)
          except Exception as exc:
              # Never fail silently: a corrupt/missing summary still emails the operator.
              subject = "Bikedeals scrape — FAILED (summary unreadable)"
              body = (
                  "The scraper did not produce a readable summary "
                  f"({type(exc).__name__}: {exc}). Check the workflow logs."
              )

          subject = clean(subject)
          delimiter = "EMAILBODY_EOF"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"subject={subject}\n")
              out.write(f"body<<{delimiter}\n{body}\n{delimiter}\n")
          PYEOF

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'ventraip.email' }}
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.format.outputs.subject }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Bikedeals Scraper <${{ secrets.SMTP_USER }}>
          body: ${{ steps.format.outputs.body }}
