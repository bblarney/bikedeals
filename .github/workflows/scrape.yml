name: Daily Scrape

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

  scrape:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Split vendors across independent jobs so each draws its own GitHub
      # Actions runner IP instead of one job burning through all ~68 vendors
      # from a single IP whose reputation degrades with Cloudflare/Shopify's
      # bot mitigation partway through. Keep SHARD_COUNT below in sync with
      # the length of this list.
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers (shard ${{ matrix.shard }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: python -m scrapers.run

      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-summary-${{ matrix.shard }}
          path: scrape_summary.json
          retention-days: 1
          if-no-files-found: warn

  notify:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download shard summaries
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-summary-*
          path: summaries

      - name: Merge shard summaries + format email
        id: format
        run: |
          python - <<'PYEOF'
          import json, os, pathlib
          from collections import Counter

          def clean(value):
              # Collapse any newlines/control chars: they would break the
              # single-line GITHUB_OUTPUT format and the email subject.
              return " ".join(str(value).split())

          summary_files = sorted(pathlib.Path("summaries").glob("*/scrape_summary.json"))
          try:
              if not summary_files:
                  raise FileNotFoundError("no shard summaries were found")

              # Combine every shard's scrape_summary.json into one report, as if
              # a single job had scraped all vendors.
              merged = {
                  "run_at": None,
                  "duration_seconds": 0.0,
                  "vendors_total": 0,
                  "vendors_ok": 0,
                  "vendors_failed": 0,
                  "total_bikes_upserted": 0,
                  "failures": [],
              }
              warning_counts: Counter = Counter()
              for path in summary_files:
                  s = json.loads(path.read_text())
                  merged["run_at"] = merged["run_at"] or s["run_at"]
                  # Shards run in parallel, so the run's wall-clock duration is
                  # the slowest shard, not the sum of all of them.
                  merged["duration_seconds"] = max(merged["duration_seconds"], s["duration_seconds"])
                  merged["vendors_total"] += s["vendors_total"]
                  merged["vendors_ok"] += s["vendors_ok"]
                  merged["vendors_failed"] += s["vendors_failed"]
                  merged["total_bikes_upserted"] += s["total_bikes_upserted"]
                  merged["failures"].extend(s["failures"])
                  for w in s.get("warnings", []):
                      warning_counts[(w["level"], w["message"])] += w.get("count", 1)

              merged["warnings"] = [
                  {"level": level, "message": message, "count": n}
                  for (level, message), n in sorted(
                      warning_counts.items(), key=lambda kv: (-kv[1], kv[0][0], kv[0][1])
                  )
              ]

              s = merged
              status = "OK" if s["vendors_failed"] == 0 else f"FAILED ({s['vendors_failed']} vendor(s))"
              subject = f"Bikedeals scrape — {status} — {clean(s['run_at'])[:10]}"
              lines = [
                  f"Run:            {s['run_at']}",
                  f"Duration:       {s['duration_seconds']}s",
                  "",
                  f"Vendors OK:     {s['vendors_ok']} / {s['vendors_total']}",
                  f"Vendors failed: {s['vendors_failed']}",
                  f"Bikes upserted: {s['total_bikes_upserted']}",
              ]
              if s["failures"]:
                  lines += ["", "Failures:"]
                  for f in s["failures"]:
                      lines.append(f"  - {clean(f['vendor'])}: {clean(f['error'])}")

              # Every warning/error logged during the run, not just the failures
              # above — so issues that don't sink a whole vendor stay visible.
              warnings = s.get("warnings", [])
              if warnings:
                  lines += ["", f"Warnings & errors ({len(warnings)}):"]
                  for w in warnings:
                      count = w.get("count", 1)
                      suffix = f" (x{count})" if count > 1 else ""
                      lines.append(f"  - [{clean(w['level'])}] {clean(w['message'])}{suffix}")
              body = "\n".join(lines)
          except Exception as exc:
              # Never fail silently: a corrupt/missing summary still emails the operator.
              subject = "Bikedeals scrape — FAILED (summary unreadable)"
              body = (
                  "The scraper did not produce a readable summary "
                  f"({type(exc).__name__}: {exc}). Check the workflow logs."
              )

          subject = clean(subject)
          delimiter = "EMAILBODY_EOF"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"subject={subject}\n")
              out.write(f"body<<{delimiter}\n{body}\n{delimiter}\n")
          PYEOF

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'ventraip.email' }}
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.format.outputs.subject }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Bikedeals Scraper <${{ secrets.SMTP_USER }}>
          body: ${{ steps.format.outputs.body }}
