<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rear wheel -->
  <circle cx="11" cy="32" r="9" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Front wheel -->
  <circle cx="37" cy="32" r="9" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Chainstay: BB to rear axle -->
  <line x1="24" y1="27" x2="11" y2="32" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seat stays: saddle post to rear axle -->
  <line x1="18" y1="12" x2="11" y2="32" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fork: head tube to front axle -->
  <line x1="31" y1="12" x2="37" y2="32" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="18" y1="12" x2="31" y2="12" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seat tube: saddle to BB -->
  <line x1="18" y1="12" x2="24" y2="27" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Down tube: head to BB -->
  <line x1="31" y1="12" x2="24" y2="27" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Grid triangle mark (solid triangle inside frame, the BikeGrid logo detail) -->
  <path d="M18 21 L24 27 L27 19 Z" fill="#0f172a"/>
  <!-- Saddle -->
  <line x1="14" y1="11" x2="21" y2="11" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Drop handlebars -->
  <path d="M31 12 L35 9 L37 13" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
