<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Solid tile, not a transparent line drawing: Google renders the favicon at
       ~16px against both white and dark chrome, and bare 2.5px strokes vanish.
       Keep this in sync with favicon.ico / favicon-*.png, which are the same
       geometry rasterised (see the mark set generated for /favicon.ico). -->
  <rect width="48" height="48" rx="9.6" fill="#0f172a"/>
  <g transform="translate(24 24) scale(0.8) translate(-24 -24.6)"
     stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <!-- Rear wheel -->
    <circle cx="11" cy="32" r="9"/>
    <!-- Front wheel -->
    <circle cx="37" cy="32" r="9"/>
    <!-- Chainstay: BB to rear axle -->
    <line x1="24" y1="27" x2="11" y2="32"/>
    <!-- Seat stays: saddle post to rear axle -->
    <line x1="18" y1="12" x2="11" y2="32"/>
    <!-- Fork: head tube to front axle -->
    <line x1="31" y1="12" x2="37" y2="32"/>
    <!-- Top tube -->
    <line x1="18" y1="12" x2="31" y2="12"/>
    <!-- Seat tube: saddle to BB -->
    <line x1="18" y1="12" x2="24" y2="27"/>
    <!-- Down tube: head to BB -->
    <line x1="31" y1="12" x2="24" y2="27"/>
    <!-- Grid triangle mark (solid triangle inside frame, the BikeGrid logo detail) -->
    <path d="M18 21 L24 27 L27 19 Z" fill="#ffffff"/>
    <!-- Saddle -->
    <line x1="14" y1="11" x2="21" y2="11"/>
    <!-- Drop handlebars -->
    <path d="M31 12 L35 9 L37 13" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
