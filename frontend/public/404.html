<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — BikeGrid</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <!-- Self-contained by necessity: public/ is copied verbatim into dist, so
         this page cannot reference the hashed Tailwind bundle. Styles are
         inline and the palette is transcribed from src/index.css. -->
    <style>
      :root {
        --navy-900: #0e1c3a;
        --orange-600: #ea580c;
        --orange-700: #c2410c;
        --slate-50: #f8fafc;
        --slate-400: #94a3b8;
        --slate-600: #475569;
        --slate-900: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--slate-50);
        color: var(--slate-900);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        background: var(--navy-900);
        padding: 0.625rem 1.5rem;
        display: flex;
        align-items: center;
      }
      header img { height: 2.75rem; width: auto; object-fit: contain; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 3rem 1.5rem 4rem;
      }
      .code {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--orange-600);
        margin: 0 0 0.75rem;
      }
      h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 0.75rem; }
      p {
        color: var(--slate-600);
        font-size: 0.9375rem;
        line-height: 1.625;
        max-width: 30rem;
        margin: 0 0 1.75rem;
      }
      .cta {
        display: inline-block;
        background: var(--orange-600);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9375rem;
        padding: 0.625rem 1.5rem;
        border-radius: 0.5rem;
        transition: background 0.15s;
      }
      .cta:hover { background: var(--orange-700); }
      nav {
        margin-top: 2.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 1.5rem;
      }
      nav a {
        color: var(--slate-600);
        text-decoration: none;
        font-size: 0.875rem;
      }
      nav a:hover { color: var(--orange-600); text-decoration: underline; }
      footer {
        text-align: center;
        padding: 1.5rem;
        font-size: 0.8125rem;
        color: var(--slate-400);
      }
      @media (min-width: 640px) {
        h1 { font-size: 2.25rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/"><img src="/logos/bikegrid/bikegrid_white.png" alt="BikeGrid" /></a>
    </header>

    <main>
      <p class="code">Error 404</p>
      <h1>This page has ridden off</h1>
      <p>
        The page you were after doesn't exist. If you followed a link to a bike
        deal, it may have sold out — deals come and go daily as shops update
        their stock.
      </p>
      <a class="cta" href="/">Browse today's deals</a>

      <nav>
        <a href="/guides">Buying guides</a>
        <a href="/about">About</a>
        <a href="/sitemap">Sitemap</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>

    <footer>BikeGrid — daily bike deals from Australian shops</footer>
  </body>
</html>
