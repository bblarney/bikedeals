<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Order matters: browsers take the SVG, and Googlebot-Image takes the
         .ico it fetches from /favicon.ico regardless. Both must exist as real
         files, or the SPA fallback answers /favicon.ico with HTML. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="commission-factory-verification" content="e39dfbb9e03144b191b246ec9add3899" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1705476604410175" crossorigin="anonymous"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://bikegrid.com.au/#organization",
          "name": "BikeGrid",
          "url": "https://bikegrid.com.au/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://bikegrid.com.au/logos/bikegrid/bikegrid.png"
          },
          "description": "BikeGrid aggregates daily bike deals from local Australian bike shops."
        },
        {
          "@type": "WebSite",
          "@id": "https://bikegrid.com.au/#website",
          "url": "https://bikegrid.com.au/",
          "name": "BikeGrid",
          "publisher": { "@id": "https://bikegrid.com.au/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://bikegrid.com.au/deals?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces. Inter is the site: body, UI, and every figure, whose
         columns line up on its tabular numerals. Archivo appears only where a
         page is announcing itself (the hero, section headings), which is the
         one place a second voice earns its download. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet" />
