<!doctype html>
<meta charset="utf-8">
<title>bikegrid post card</title>
<style>
  /* 1080x1350 is the tallest format Instagram shows uncropped in-feed, so it
     buys the most screen for the same scroll. Every dimension below is in that
     fixed frame: this page is only ever rendered at one size. */
  :root {
    --navy-900: #0e1c3a;
    --navy-850: #142544;
    --navy-700: #28395c;
    --accent: #f97316;
    --muted: #8ea0c2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: var(--navy-900);
    color: #fff;
    /* No webfont on purpose: the renderer runs in CI with no network access to
       a font CDN, and a silently-missing face would ship a broken card. */
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 44px 56px 30px;
  }
  header img { height: 46px; }
  header .site { font-size: 25px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }

  .stage {
    position: relative;
    margin: 0 56px;
    height: 620px;
    background: #fff;
    border-radius: 26px;
    overflow: hidden;
  }
  /* contain, not cover: product shots arrive in every aspect ratio and a
     cropped bike looks like a mistake. The white panel is the shop's own
     backdrop in almost every case, so the letterboxing is invisible. */
  .stage img { width: 100%; height: 100%; object-fit: contain; padding: 30px; }

  .badge {
    position: absolute;
    top: 26px;
    right: 26px;
    background: var(--accent);
    color: #fff;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.02em;
    padding: 14px 30px;
    border-radius: 999px;
  }

  .body { flex: 1; padding: 44px 56px 0; }
  .brand {
    color: var(--accent);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .model {
    margin-top: 14px;
    font-size: {{MODEL_FONT_SIZE}}px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.02em;
    /* Two lines is the honest maximum at this size. Shops write some very long
       model names and the price row below must never be pushed off the card. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .prices { margin-top: 34px; display: flex; align-items: baseline; gap: 26px; }
  .was { font-size: 44px; color: var(--muted); text-decoration: line-through; }
  .now { font-size: 82px; font-weight: 800; letter-spacing: -0.03em; }

  .chips { margin-top: 30px; display: flex; gap: 14px; }
  .chip {
    background: var(--navy-700);
    color: #dbe4f5;
    font-size: 27px;
    padding: 12px 24px;
    border-radius: 999px;
  }

  footer {
    margin-top: auto;
    padding: 34px 56px 46px;
    background: var(--navy-850);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 29px;
  }
  /* The shop's credit. It is their photograph and their price, and this is the
     line that says so on the image itself rather than only in the caption. */
  footer .via { color: #dbe4f5; }
  footer .via strong { color: #fff; font-weight: 700; }
  footer .cta { color: var(--muted); }
</style>

<header>
  <img src="{{LOGO}}" alt="bikegrid">
  <span class="site">bikegrid.com.au</span>
</header>

<div class="stage">
  <img src="{{PRODUCT_IMAGE}}" alt="">
  <div class="badge">{{DISCOUNT}}% off</div>
</div>

<div class="body">
  <div class="brand">{{BRAND}}</div>
  <div class="model">{{MODEL}}</div>
  <div class="prices">
    <span class="was">{{PRICE_WAS}}</span>
    <span class="now">{{PRICE_NOW}}</span>
  </div>
  <div class="chips">{{CHIPS}}</div>
</div>

<footer>
  <span class="via">via <strong>{{VENDOR}}</strong>{{CITY}}</span>
  <span class="cta">link in bio</span>
</footer>
